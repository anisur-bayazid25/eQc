name: Build and Release eQc

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Rollup native dependency on macOS
        if: runner.os == 'macOS'
        run: npm install @rollup/rollup-darwin-${{ matrix.arch }}@4.62.2 --no-save

      - name: Check Mac packaging safeguards
        run: node --test tests/mac-packaging.cjs

      - name: Run feature regression tests
        run: node --test tests/spreadsheet-export.cjs tests/demographic-table.cjs tests/demographics-sorting.cjs tests/passage-cases.cjs tests/research-workflow.cjs tests/zenodo-citation.cjs tests/cooccurrence.cjs tests/feedback-apps-script.cjs tests/feedback.cjs tests/html-report.cjs tests/starred-quotes.cjs tests/icr-comparisons.cjs tests/release-1.6.4.cjs tests/release-1.7.0.cjs tests/code-report.cjs tests/codebook-levels.cjs tests/formatted-mapping.cjs tests/source-lines.cjs tests/data-integrity.cjs tests/profile-sqlite.cjs tests/profile-store.cjs tests/time-tracking.cjs tests/milestones.cjs tests/desktop-bridge.cjs tests/resource-cleanup.cjs tests/next-help-import.cjs tests/easter-eggs.cjs tests/lan-identity.cjs tests/lan-announcements.cjs tests/memo-workspace.cjs tests/about-links.cjs tests/shortcuts.cjs tests/map-suggestions.cjs tests/map-drafts.cjs tests/map-text-fit.cjs tests/visualizations.cjs tests/statistical-visualizations.cjs tests/map-palettes.cjs tests/map-objects.cjs tests/sankey-words.cjs

      - name: Validate fictional demo dataset
        run: node demo/climate-resilience/build-demo.cjs

      - name: Upload fictional demo kit
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fictional-demo-kit
          path: demo/climate-resilience/eQc_Fictional_Climate_Demo.zip

      - name: Install browser test tools
        if: runner.os == 'Windows'
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium

      - name: Run usability, data-integrity, Help and memo browser checks
        if: runner.os == 'Windows'
        run: node tests/run-browser-checks.cjs
        env:
          EQC_BROWSER_CHANNEL: chromium

      - name: Build React App (Vite)
        run: npm run build

      - name: Force install Mac DMG License builder
        if: runner.os == 'macOS'
        run: npm install dmg-license --no-save

      - name: Build Electron app (no publish yet)
        if: runner.os != 'macOS'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build and verify one Mac architecture
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg:${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep architecture-specific Mac update metadata
        if: runner.os == 'macOS'
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install release metadata tools
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install only the release YAML reader
        run: npm install --prefix "$RUNNER_TEMP/eqc-release-metadata" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund js-yaml@4.3.0

      - name: Verify and combine Mac update metadata
        run: node .github/scripts/merge-mac-updates.cjs artifacts
        env:
          NODE_PATH: ${{ runner.temp }}/eqc-release-metadata/node_modules

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eQc ${{ github.ref_name }}
          draft: false
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
