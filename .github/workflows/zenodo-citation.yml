name: Sync Zenodo citation

on:
  workflow_run:
    workflows: ['Build and Release eQc']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to retry (blank uses the latest stable release)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: zenodo-citation
  cancel-in-progress: false

jobs:
  citation:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify citation sync checks
        run: node --test tests/zenodo-citation.cjs
      - name: Wait for the matching Zenodo DOI and update citation
        run: node .github/scripts/sync-zenodo-citation.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Commit citation and README
        shell: bash
        run: |
          if git diff --quiet -- CITATION.cff README.md; then
            echo 'No citation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CITATION.cff README.md
          git commit -m 'docs: sync published Zenodo DOI'
          git push origin HEAD
